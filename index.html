<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Something awesome is on its way. Our website is under construction." />
    <title>Under Construction — Coming Soon</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Dynamic Background -->
    <div class="bg-container" id="bg-container">
        <div class="bg-element bg-1"></div>
        <div class="bg-element bg-2"></div>
        <div class="grid-overlay"></div>
    </div>

    <main class="page-wrapper">
        <div class="status-badge" role="status">
            <span class="badge-dot"></span>
            Something Great is Coming
        </div>

        <div class="main-hero">
            <h1>We're building for you</h1>
            <p>Under Construction &bull; Coming Soon</p>
        </div>

        <div class="hero-image-wrapper">
            <div class="glow-effect"></div>
            <img 
                src="https://cdni.iconscout.com/illustration/premium/thumb/coder-illustration-svg-download-png-2895977.png" 
                alt="Coder Illustration" 
                class="hero-image"
            />
        </div>

    </main>

    <footer>
        <div class="footer-divider" aria-hidden="true"></div>

        <p class="footer-promo">Want your own under construction page?</p>
        <p class="footer-credit">Crafted with <span class="heart">♥</span> by <a href="https://github.com/webdeveloperdesigner" target="_blank" rel="noopener noreferrer">webdeveloperdesigner</a></p>

        <!-- GitHub CTA -->
        <a
            href="https://github.com/webdeveloperdesigner/under-construction-page"
            target="_blank"
            rel="noopener noreferrer"
            class="footer-cta"
            id="github-cta"
            aria-label="View Project Source on GitHub"
        >
            <svg class="github-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>Star on GitHub</span>
        </a>

        <p class="footer-copyright">&copy; 2026 &mdash; Free to use &amp; open source</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
